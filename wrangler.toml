name = "the-funeral"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static files. The Worker runs first so every page sits behind the Google login.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "funeral"
# Replace with the id printed by: npx wrangler d1 create funeral
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Who may sign in (comma separated email domains)
ALLOWED_DOMAINS = "azoma.ai,ecomtent.ai"
# Set to "true" to also require Google Workspace-managed accounts on those domains
REQUIRE_WORKSPACE = "false"

# Secrets (set with: npx wrangler secret put NAME), never committed:
#   GOOGLE_CLIENT_ID      OAuth client id from Google Cloud
#   GOOGLE_CLIENT_SECRET  OAuth client secret from Google Cloud
#   SESSION_SECRET        random string, signs login cookies
#   BALLOT_SECRET         random string, keys the anonymous vote hashes (never change it)
#   ADMIN_EMAILS          comma separated emails allowed into /admin
#   ADMIN_PASSWORD        password that unlocks /admin for any signed-in user (optional)
