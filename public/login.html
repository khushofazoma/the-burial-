<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter the Graveyard · The Funeral</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/brand/azoma-mark-purple.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=IM+Fell+English:ital@0;1&family=Spectral+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="cloud" style="--top:9vh;--w:420px;--dur:140s;--delay:-30s"></div>
    <div class="cloud" style="--top:15vh;--w:300px;--dur:95s;--delay:-70s"></div>
  </div>
  <div class="lightning" aria-hidden="true"></div>
  <div class="fog three" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"></div>
  <div class="fog two" aria-hidden="true"></div>

  <main class="gate">
    <div class="gate-stone">
      <img class="gate-mark" src="/brand/azoma-mark-white.svg" alt="" width="54" height="54">
      <div class="eyebrow">Azoma · Ceremony of Retirement</div>
      <h1 class="title gate-title">The Funeral</h1>
      <p class="gate-sub">Only the living of Azoma and Ecomtent may pass.</p>

      <a class="google-btn" id="googleBtn" href="/auth/login">
        <svg viewBox="0 0 48 48" aria-hidden="true" width="20" height="20">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span>Sign in with Google</span>
      </a>

      <form class="dev-login" id="devLogin" action="/auth/dev" method="get" hidden>
        <label for="devEmail">Local testing: sign in as</label>
        <div class="dev-row">
          <input id="devEmail" name="email" type="email" placeholder="you@azoma.ai" required>
          <button class="btn btn-ghost btn-sm" type="submit">Enter</button>
        </div>
      </form>

      <p class="form-error gate-error" id="gateError" role="alert"></p>
      <p class="gate-note">Your vote stays anonymous. Signing in only proves you work here.</p>
    </div>
  </main>

  <script src="/ambience.js"></script>
  <script src="/login.js"></script>
</body>
</html>
